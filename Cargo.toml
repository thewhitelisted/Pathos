[package]
name = "pathos"
version = "0.2.0"
edition = "2024"
description = "Sentiment-aware portfolio optimizer: FinBERT news sentiment + SEC fundamentals feeding a Black-Litterman model"
readme = "README.md"
default-run = "pathos"

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
nalgebra = "0.35"
reqwest = { version = "0.12", features = ["json", "gzip"] }
csv = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1

# candle's matmuls are unusably slow without optimizations, so optimize
# dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
